name = "skillflex"
main = "apps/api/src/cloudflare.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 3 * * *"]

[vars]
NODE_ENV = "production"
# R2 credentials are SECRETS, not vars: `wrangler secret put R2_ACCOUNT_ID`,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. Only the non-sensitive bucket name
# belongs in this file.
MEDIA_PROVIDER = "r2"
R2_BUCKET = "pymedia"
SUPPORT_LLM_BASE_URL = "https://api.groq.com/openai/v1"
SUPPORT_LLM_MODEL = "llama-3.3-70b-versatile"
